[package]
name = "oghma-library"
version = "0.1.0"
description = "Oghma Library desktop app"
authors = ["Oghma Library"]
edition = "2021"

[lib]
name = "oghma_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.1"

