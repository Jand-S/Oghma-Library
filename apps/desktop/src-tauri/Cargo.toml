[package]
name = "oghma-library"
version = "2.0.3"
description = "Oghma Library desktop app"
authors = ["Oghma Library"]
edition = "2021"

[lib]
name = "oghma_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kindling-mobi = "0.19"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["io-util", "sync", "time", "macros", "rt", "net"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
futures-lite = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]

[patch.crates-io]
kindling-mobi = { path = "../../../vendor/kindling-mobi" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Devices_PortableDevices",
  "Win32_UI_Shell_PropertiesSystem",
] }
