<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="icon-clip">
      <rect width="200" height="200" rx="20" ry="20" />
    </clipPath>
    
    <style>
      /* Animação de surgimento de baixo para cima */
      @keyframes slideUp {
        0% { transform: translateY(20px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      
      /* Animação de escala com efeito elástico */
      @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        80% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      
      /* Fade in para as sombras */
      @keyframes shadowFade {
        0% { opacity: 0; }
        100% { opacity: 0.15; }
      }

      /* Aplicação das animações nos elementos */
      .bg {
        animation: popIn 0.5s ease-out forwards;
        transform-origin: center;
      }
      
      .book {
        animation: slideUp 0.6s ease-out 0.3s forwards;
        opacity: 0; /* Inicia invisível até a animação começar */
      }
      
      .head {
        /* cubic-bezier para dar o efeito de pulo/bounce */
        animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s forwards;
        opacity: 0;
        transform-origin: 100px 58px; /* Centralizado no círculo */
      }
      
      .shadow {
        animation: shadowFade 0.8s ease-out 0.9s forwards;
        opacity: 0;
      }
    </style>
  </defs>

  <g clip-path="url(#icon-clip)" class="bg">
    <rect width="200" height="200" fill="#00897B" />

    <g class="shadow" fill="#000000">
      <path d="M 112.7,45.3 L 312.7,245.3 L 287.3,270.7 L 87.3,70.7 A 18 18 0 0 0 112.7 45.3 Z" />
      <path d="M 152,78 L 352,278 L 248,344 L 48,144 Q 74,149 100,166 Q 126,149 152,144 Z" />
    </g>

    <circle cx="100" cy="58" r="18" fill="#ffffff" class="head" />
    
    <path d="M 48,78 
             Q 74,83 100,100 
             Q 126,83 152,78 
             L 152,144 
             Q 126,149 100,166 
             Q 74,149 48,144 
             Z" 
          fill="#ffffff" class="book" />
  </g>
</svg>
