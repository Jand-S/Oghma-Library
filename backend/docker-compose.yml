services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oghma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oghma}
      POSTGRES_DB: ${POSTGRES_DB:-oghma}
    volumes:
      - ${OGHMA_PG_HOST:-pgdata}:/var/lib/postgresql/data
    # So o proprio host: os containers usam a rede do compose (db:5432). Antes ficava aberto
    # para a rede inteira com a senha padrao. OGHMA_PG_BIND=0.0.0.0 reabre, se precisar.
    ports:
      - "${OGHMA_PG_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oghma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ${OGHMA_STORAGE_HOST:-/srv/oghma}:/srv/oghma
    # A API nao tem autenticacao: so o host por padrao (OGHMA_API_BIND=0.0.0.0 abre para a rede).
    ports:
      - "${OGHMA_API_BIND:-127.0.0.1}:${OGHMA_API_HOST_PORT:-8010}:8000"

  # Executa o crawl sob demanda / via cron do host:
  #   docker compose run --rm crawler oghma crawl --source central-novel
  crawler:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ${OGHMA_STORAGE_HOST:-/srv/oghma}:/srv/oghma
    entrypoint: []
    command: ["oghma", "--help"]

volumes:
  pgdata:
