[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oghma-backend"
version = "0.1.0"
description = "Oghma Library backend: scraper + index + local API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "h2>=4.1",
  "selectolax>=0.3.21,<1",  # 1.0 removeu o parser Modest (selectolax.parser) usado pelos conectores
  "tenacity>=8.4",
  "typer>=0.12",
  "ebooklib>=0.18",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
oghma = "oghma.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
